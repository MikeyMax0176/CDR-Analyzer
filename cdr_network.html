                  var options = {"physics": {"enabled": true, "stabilization": {"enabled": true, "iterations": 150}}, "interaction": {"dragNodes": true, "hover": true}, "edges": {"smooth": true}, "nodes": {"chosen": true}};

                  


                  

                  network = new vis.Network(container, data, options);

                  

                  

                  


                  

                  return network;

              }
              drawGraph();
